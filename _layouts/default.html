<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #6a6a6a;
        --line: #e5e5e5;
        --accent: #157878;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--ink);
        line-height: 1.6;
      }
      header.banner {
        border-bottom: 1px solid var(--line);
        padding: 1.5rem 1.5rem;
      }
      header.banner .banner-inner {
        max-width: 780px;
        margin: 0 auto;
      }
      header.banner h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      header.banner p {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      main {
        max-width: 780px;
        margin: 0 auto;
        padding: 2rem 1.5rem 3rem;
      }
      main a { color: var(--accent); }
      main h1, main h2, main h3 { font-weight: 600; }
      main hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }
      footer.site-footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
        padding: 1.5rem;
      }
    </style>
  </head>
  <body>
    <header class="banner">
      <div class="banner-inner">
        <h1>{{ page.title | default: site.title | default: site.github.repository_name }}</h1>
        <p>{{ page.description | default: site.description }}</p>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      Hosted on GitHub Pages
    </footer>
  </body>
</html>
